spring:
  ai:
    openai:
      base-url: http://localhost:8080/v1
      chat:
        options:
          model: gpt-4o-mini

management:
  tracing:
    sampling:
      probability: 1.0
  observations:
    enable:
      http.server.requests: false
      http.client.requests: false
      okhttp.requests: false
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces
